<!doctype html>
<html lang="fr">
  <head>
    <script>
      // Le theme choisi dans Terrain vaut aussi ici (meme adresse, meme reglage),
      // applique avant le premier rendu pour eviter un flash clair/sombre.
      (function () {
        var t = localStorage.getItem('af-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      })()
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Outil interne : accessible par lien, jamais par un moteur de recherche. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d1b1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/bureau/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
    <title>Atout Flair — Bureau</title>
  </head>
  <body class="app-bureau">
    <div class="hors-ligne" role="status">Hors ligne — le bureau se mettra à jour au retour du réseau</div>
    <main id="app"></main>
    <script type="module" src="/src/bureau/main.js"></script>
  </body>
</html>
