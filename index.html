<!doctype html>
<html lang="fr">
  <head>
    <script>
      // Applique le theme choisi avant le premier rendu, pour eviter un flash
      // clair/sombre au chargement. Si rien n'est enregistre, le mode systeme
      // (@media prefers-color-scheme) s'applique tout seul via le CSS.
      (function () {
        var t = localStorage.getItem('af-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      })()
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
    <title>Atout Flair — Rapports de détection</title>
  </head>
  <body>
    <!-- Photo de fond de l'accueil : posee ici plutot que dans l'ecran, pour
         qu'elle ne soit ni rechargee ni redessinee a chaque rendu. Le voile
         par-dessus garde le contenu lisible. -->
    <div class="app-bg" aria-hidden="true">
      <img src="/hero-dog.webp" alt="" />
      <span class="app-bg-veil"></span>
    </div>
    <main id="app"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
