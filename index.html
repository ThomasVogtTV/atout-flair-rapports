<!doctype html>
<html lang="fr">
  <head>
    <script>
      // Applique le theme choisi avant le premier rendu, pour eviter un flash
      // clair/sombre au chargement. Si rien n'est enregistre, le mode systeme
      // (@media prefers-color-scheme) s'applique tout seul via le CSS.
      (function () {
        var t = localStorage.getItem('af-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      })()
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Outil interne : accessible par lien, jamais par un moteur de recherche. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d1b1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" href="/icon-192.png" />
    <title>Atout Flair — Rapports de détection</title>
  </head>
  <body>
    <!-- Bandeau reseau : pose hors de #app pour qu'il traverse les changements
         d'ecran sans etre redessine. Il ne s'affiche que hors ligne. -->
    <div class="hors-ligne" role="status">Hors ligne — tout reste enregistré sur l'appareil</div>
    <main id="app"></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
